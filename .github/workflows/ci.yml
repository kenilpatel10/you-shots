name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      REMOTION_PREFER_DOWNLOADED_BROWSER: "1"
      REMOTION_CONCURRENCY: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Cache Remotion browser
        uses: actions/cache@v4
        with:
          path: |
            .remotion
            node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: 3-second smoke render
        run: npm run smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-render
          path: out/smoke/
          if-no-files-found: ignore
          retention-days: 7
