name: Publish approved drafts
# Runs hourly; processes Telegram /approve, /reject, /redo, /status and uploads approved drafts.

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bolt-state
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      # One extra line per additional channel: YOUTUBE_REFRESH_TOKEN_<LANG> for the default persona,
      # YOUTUBE_REFRESH_TOKEN_<PERSONA>_<LANG> for others (see docs/PERSONAS.md).
      YOUTUBE_REFRESH_TOKEN_HI: ${{ secrets.YOUTUBE_REFRESH_TOKEN_HI }}
      YOUTUBE_REFRESH_TOKEN_NCERT_SCIENCE_HI: ${{ secrets.YOUTUBE_REFRESH_TOKEN_NCERT_SCIENCE_HI }}
      YOUTUBE_REFRESH_TOKEN_NCERT_SCIENCE_EN: ${{ secrets.YOUTUBE_REFRESH_TOKEN_NCERT_SCIENCE_EN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CHANNEL_LANGUAGE: ${{ vars.CHANNEL_LANGUAGE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: if [ -f package-lock.json ]; then npm ci --omit=optional; else npm install --no-audit --no-fund; fi
      - name: Process Telegram commands and upload approved drafts
        run: npm run publish
      - name: Commit state
        run: scripts/commit-state.sh "publish $(date -u +%FT%H:%M)"
      - name: Alert on failure
        if: failure()
        run: scripts/telegram-alert.sh publish
